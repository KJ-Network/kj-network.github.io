<html>
<head>
<link rel="stylesheet" href="https://kopsourcesorg.github.io/github-activity/octicons.min.css">
<link rel="stylesheet" href="https://kopsourcesorg.github.io/github-activity/github-activity.min.css">

<script src="https://kopsourcesorg.github.io/github-activity/jquery-1.11.0.js"></script>
<script type="text/javascript" src="https://kopsourcesorg.github.io/github-activity/mustache.min.js"></script>
<script type="text/javascript" src="https://kopsourcesorg.github.io/github-activity/github-activity.min.js"></script>
<script>
  function updateFeed(username) {
    GitHubActivity.feed({ username: username, selector: '#feed' });
  }

  $(document).ready(function() {
    updateFeed('KopsourcesORG');

    $('#update').click(function() { updateFeed($("#username").val()); });
    $("#username").keypress(function(e) {
      if (e.which === 13) {
        updateFeed($("#username").val());
      }
    });
  });
</script>
<style>
  html, body {
    width: 100%;
    height: 100%;
  }

  body {
    padding: 20px;
    font-family: 'Helvetica', 'Arial';
  }

  #feed {
    width: 700px;
    height: 600px;
    margin: 30px 0;
  }
</style>
</head>
<body>
<h1><i class="fa fa-github"></i> Kopsources.ORG GitHub Activity Stream</h1>
 
<p>Here are the recent activities of this organization.</p>

<p>Powered By <a href="https://github.com/caseyscarborough/github-activity">GitHub Activity Stream</a>.</p>

<div id="feed"></div>
</body>
</html>
